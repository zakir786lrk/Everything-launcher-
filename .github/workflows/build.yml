name: Build APK

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs (Release & Debug)
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Locate Release APK
        id: apk-release
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found release APK at $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Locate Debug APK
        id: apk-debug
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Found debug APK at $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload Release APK Artifact (Optimized Small Size)
        uses: actions/upload-artifact@v4
        with:
          name: EverythingLauncher-Release-Optimized
          path: ${{ steps.apk-release.outputs.apk_path }}
          retention-days: 30

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EverythingLauncher-Debug
          path: ${{ steps.apk-debug.outputs.apk_path }}
          retention-days: 30

      - name: Create Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.apk-release.outputs.apk_path }}
            ${{ steps.apk-debug.outputs.apk_path }}
          draft: false
          prerelease: false
          generate_release_notes: true
